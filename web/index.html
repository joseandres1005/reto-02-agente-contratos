<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agente de Contratos — Periferia IT Group</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1a202c;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a365d;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 18px; }
    header .status { font-size: 12px; opacity: 0.8; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #3182ce;
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e2e8f0;
    }
    .msg.system {
      align-self: center;
      font-size: 12px;
      color: #718096;
      text-align: center;
    }
    .tool-call {
      align-self: flex-start;
      max-width: 80%;
      background: #fffaf0;
      border: 1px solid #f6ad55;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 12px;
    }
    .tool-call.ok { background: #f0fff4; border-color: #68d391; }
    .tool-call.error { background: #fff5f5; border-color: #fc8181; }
    .tool-call .name { font-weight: bold; color: #2d3748; margin-bottom: 4px; }
    .tool-call .args { color: #4a5568; margin: 4px 0; word-break: break-all; }
    .tool-call .resumen { color: #718096; font-size: 11px; }
    .confirm-banner {
      align-self: flex-start;
      background: #fff5f5;
      border-left: 4px solid #f56565;
      padding: 12px 16px;
      border-radius: 6px;
      max-width: 80%;
      font-size: 13px;
    }
    .confirm-banner strong { color: #c53030; }
    footer {
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 12px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    #input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }
    button {
      padding: 12px 24px;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #2c5282; }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #cbd5e0;
      border-top-color: #3182ce;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>📄 Agente de Registro de Contratos</h1>
    <span class="status" id="status">Listo</span>
  </header>
  <div id="chat"></div>
  <footer>
    <input
      id="input"
      placeholder="Escribe un mensaje… (ej: Procesa el buzón con fecha de hoy 2026-09-03)"
      autocomplete="off"
    />
    <button id="send">Enviar</button>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const sessionId = "sess-" + Math.random().toString(36).slice(2, 10);

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    function addMsg(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function addToolCall(tc) {
      const el = document.createElement("div");
      el.className = "tool-call " + (tc.ok ? "ok" : "error");
      el.innerHTML =
        `<div class="name">🔧 ${escapeHtml(tc.name)}</div>` +
        `<div class="args">${escapeHtml(tc.arguments).slice(0, 250)}</div>` +
        `<div class="resumen">${tc.ok ? "✅" : "⚠️"} ${escapeHtml(tc.resumen)}</div>`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function addConfirmBanner() {
      const el = document.createElement("div");
      el.className = "confirm-banner";
      el.innerHTML =
        "<strong>⏸️ El agente espera tu confirmación.</strong> " +
        "Revisa los campos dudosos y responde con 'sí' o corrige los valores.";
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMsg("user", text);
      send.disabled = true;
      input.disabled = true;
      status.innerHTML = '<span class="spinner"></span>Pensando…';

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, message: text }),
        });
        const data = await res.json();

        if (!data.ok) {
          addMsg("system", "❌ Error: " + (data.error ?? "desconocido"));
        } else {
          for (const tc of data.toolCalls ?? []) addToolCall(tc);
          addMsg("assistant", data.reply);
          if (data.needsConfirmation) addConfirmBanner();
          status.textContent = data.usage
            ? `Listo · ${data.usage.total_tokens} tokens`
            : "Listo";
        }
      } catch (e) {
        addMsg("system", "❌ Error de red: " + e.message);
        status.textContent = "Error";
      } finally {
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    input.focus();

    addMsg(
      "system",
      "Bienvenido. Prueba con: «Procesa el buzón con fecha de hoy 2026-09-03. No registres nada dudoso sin preguntarme.»"
    );
  </script>
</body>
</html>
